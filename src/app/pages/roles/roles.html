<div class="page">
  <div class="page-header">
    <div>
      <h2>Rôles</h2>
      <p>{{ roles.length }} rôles définis</p>
    </div>
    <button mat-raised-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon> Nouveau rôle
    </button>
  </div>

  <mat-card class="form-card" *ngIf="showForm">
    <mat-card-header>
      <mat-card-title>Créer un rôle</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="save()" class="role-form">
        <mat-form-field appearance="outline">
          <mat-label>Nom du rôle</mat-label>
          <input matInput formControlName="nom">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Description</mat-label>
          <input matInput formControlName="description">
        </mat-form-field>
        <div class="form-actions">
          <button mat-button type="button" (click)="showForm=false">Annuler</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Créer</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-content>
      <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
      <table mat-table [dataSource]="roles" class="full-width">
        <ng-container matColumnDef="nom">
          <th mat-header-cell *matHeaderCellDef>Rôle</th>
          <td mat-cell *matCellDef="let r"><strong>{{ r.nom }}</strong></td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let r">{{ r.description }}</td>
        </ng-container>
        <ng-container matColumnDef="permissions">
          <th mat-header-cell *matHeaderCellDef>Permissions</th>
          <td mat-cell *matCellDef="let r">
            <mat-chip-set>
              <mat-chip *ngFor="let p of r.permissions">{{ p.nom }}</mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let r">
            <button mat-icon-button color="warn" (click)="delete(r)" matTooltip="Supprimer">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
