
# ===== Datasource H2 (dev) =====
spring.datasource.url=jdbc:h2:mem:usermanagerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===== JWT =====
jwt.secret=ZmFrZVNlY3JldEtleUZvclNwcmluZ0Jvb3QxMjM0NTY=
jwt.expiration=86400000

# ===== App =====
spring.application.name=usermanager
server.port=8080

# ===== CORS =====
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ===== Logging =====
logging.level.com.projet.usermanager=DEBUG
logging.level.org.springframework.security=INFO